name: ChiourimBA
options:
  bundleIdPrefix: com.chiourimsba
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ChiourimBA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChiourimBA
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chiourimsba.app
        PRODUCT_NAME: ChiourimBA
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ChiourimBA/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # Évite l'avertissement « Metadata extraction skipped » sans exposer de raccourci.
        OTHER_LDFLAGS: "-framework AppIntents"
    scheme:
      testTargets:
        - ChiourimBATests
  ChiourimBATests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ChiourimBATests
    dependencies:
      - target: ChiourimBA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chiourimsba.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChiourimBA.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ChiourimBA"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        # Évite l'avertissement « Metadata extraction skipped » sans exposer de raccourci.
        OTHER_LDFLAGS: "-framework AppIntents"
